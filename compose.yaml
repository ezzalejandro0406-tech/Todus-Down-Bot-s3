services:
  telegram-jk-bot:
    build: .
    container_name: telegram-jk-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TMPDIR: /tmp
      BOT_DATA_DIR: /app/data
      CLOUD_AUTO_RENEW: "true"
    init: true
    read_only: true
    volumes:
      - bot-data:/app/data
      - bot-tmp:/tmp
    security_opt:
      - no-new-privileges:true

volumes:
  bot-data:
  bot-tmp:
